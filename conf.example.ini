; ─────────────────────────────────────────────────────────────────────────────
; Пример конфигурации. Скопируйте этот файл в conf.ini (рядом с main.py или
; stars_parser.exe) и заполните секцию [API].
;
;   ID_API / HASH_API — https://my.telegram.org -> API development tools
;   PHONE             — номер телефона аккаунта в международном формате
;   CLOUD_PASSWORD    — облачный пароль (2FA). Оставьте пустым, если его нет:
;                       тогда пароль будет запрошен в консоли.
; ─────────────────────────────────────────────────────────────────────────────

[API]
ID_API=
HASH_API=
PHONE=
CLOUD_PASSWORD=

[SESSION]
; Имя файла сессии (будет создан anon.session рядом с приложением)
NAME=anon
; Параметры «устройства» для маскировки под официальный клиент
DEVICE_MODEL=SM-G991B
SYSTEM_VERSION=Android 14
APP_VERSION=8.8.2
LANG_CODE=en

[DELAY]
; Задержка применяется **между запросами к Telegram**, а не между сообщениями:
; история приходит пачками по 100 постов за один запрос, а посты без звёзд и
; уже известные донаторы запросов не требуют вовсе — ждать там незачем.
; random.uniform(MIN, MAX) перед каждым реальным запросом.
MESSAGES_INTERVAL_MIN=0.05
MESSAGES_INTERVAL_MAX=0.1

[SPEED]
; Пауза из [DELAY] — между запросами к API (true) или после каждого сообщения
; (false — старое, медленное поведение: ~10 сообщ./с и 12 минут сна на 10 000 постов)
PER_REQUEST_DELAY=true
; Пауза Telethon между пачками истории: 0 — не ждать (темп задаёт [DELAY]),
; auto — как в Telethon (1 с между пачками при количестве постов > 3000),
; число — своя пауза в секундах. Ставьте 1 или auto, если ловите FloodWait.
HISTORY_WAIT_TIME=0
; Сколько сообщений обрабатывать одной пачкой (чем больше пачка, тем больше
; донаторов попадает в один запрос и тем меньше всего запросов). 10-1000.
MESSAGE_BATCH=500
; Сколько отправителей получать одним запросом users.getUsers (лимит API — 200).
ENTITY_BATCH=200
; Сколько запросов к API держать в воздухе одновременно (1 — строго по очереди).
; Больше 5 поднимает риск FloodWait.
CONCURRENCY=3
; Пробовать ли донаторов, которых нет в кэше сессии (access_hash неизвестен):
; пачкой по ENTITY_BATCH с hash=0. Почти всегда это not_found, поэтому false —
; самый быстрый и самый безопасный вариант (запросов к сети не будет вовсе).
RESOLVE_UNKNOWN_PEERS=true

; ── Необязательные секции (можно удалить — используются значения по умолчанию) ─

[PROXY]
; Прокси (нужен пакет python-socks: pip install python-socks).
; ENABLED=false — подключаться напрямую
; Прокси и далёкий дата-центр увеличивают время каждого запроса: без прокси парсинг быстрее.
ENABLED=false
TYPE=socks5
ADDR=127.0.0.1
PORT=1080
USERNAME=
PASSWORD=
RDNS=true

[PARSER]
; Подгружать участников связанной группы обсуждения перед парсингом,
; чтобы в кэше сессии появились access_hash пользователей (больше найденных
; username). Это разовая загрузка перед парсингом: 10 000 участников —
; ~50 запросов (по 200 за запрос), обычно десятки секунд.
; true — если в результате много not_found; false — если нужен максимум скорости.
WARMUP_PARTICIPANTS=true
WARMUP_LIMIT=10000
; Сколько раз повторять ввод кода/пароля при ошибке
MAX_ATTEMPTS=3

[OUTPUT]
; Каталог для файлов (относительно папки запуска). "." — сохранять рядом с приложением
DIR=output
; Максимальная длина части имени файла с названием канала
FILENAME_MAX_LENGTH=100
; Создавать xlsx только с шапкой, если звёзд не найдено (false — не создавать)
CREATE_EMPTY_FILE=false

[BOT]
TOKEN=                      ; обязателен; переменная окружения BOT_TOKEN имеет приоритет над значением из файла
ALLOWED_USER_IDS=           ; целые id через запятую, пробелы игнорируются; пусто = доступ запрещён всем
MAX_CONCURRENT_TASKS=1      ; любое значение трактуется как 1; значение >1 -> WARNING в bot.log при старте, игнорируется
PROGRESS_EDIT_INTERVAL=2    ; сек между edit_message_text прогресса
DONOR_THRESHOLD=80          ; порог для режима ">N", целое число
SEND_FILES=true             ; true -> прикладывать xlsx в чат; false -> сохранить на диск и прислать путь
DETAILED_EXCEL=false        ; true -> дополнительно писать построчный xlsx старой схемой
MAX_CHANNELS_PER_REQUEST=20 ; лимит каналов в одном /parse
WIZARD_IDLE_TIMEOUT=600     ; сек бездействия в wizard до автосброса

